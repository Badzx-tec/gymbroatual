version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change_me}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-gymbro}
      JWT_SECRET: ${JWT_SECRET:-change_me_with_at_least_16_chars}
      FERNET_KEY: ${FERNET_KEY:-YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
      FRONTEND_BASE_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  gateway-toletus:
    build:
      context: ./gateway-toletus
    env_file:
      - .env
    environment:
      SAAS_URL: http://backend:8000
      DEVICE_ID: ${GATEWAY_DEVICE_ID:-dev_local_1}
      DEVICE_TOKEN: ${GATEWAY_DEVICE_TOKEN:-}
      TOLETUS_SIMULATOR: ${TOLETUS_SIMULATOR:-true}
      TOLETUS_HOST: ${TOLETUS_HOST:-127.0.0.1}
      TOLETUS_PORT: ${TOLETUS_PORT:-7878}
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - gateway

volumes:
  mongo_data:
