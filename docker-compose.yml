services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    # Mongo stays on the internal network only. To inspect locally, use:
    #   docker compose exec mongo mongosh -u <user> -p
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required — run scripts/gen-secrets.sh}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required — run scripts/gen-secrets.sh}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-gymbro}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run scripts/gen-secrets.sh}
      # FERNET_KEYS (preferred, comma-separated for rotation) or FERNET_KEY (legacy single key).
      # Backend reads FERNET_KEYS first; falls back to FERNET_KEY for backward compatibility.
      FERNET_KEYS: ${FERNET_KEYS:-${FERNET_KEY:?FERNET_KEYS or FERNET_KEY is required — run scripts/gen-secrets.sh}}
      FRONTEND_BASE_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  gateway-toletus:
    build:
      context: ./gateway-toletus
    env_file:
      - .env
    environment:
      SAAS_URL: ${SAAS_URL:-http://backend:8000}
      DEVICE_ID: ${GATEWAY_DEVICE_ID:-dev_local_1}
      DEVICE_TOKEN: ${GATEWAY_DEVICE_TOKEN:-}
      TOLETUS_SIMULATOR: ${TOLETUS_SIMULATOR:-true}
      TOLETUS_HOST: ${TOLETUS_HOST:-127.0.0.1}
      TOLETUS_PORT: ${TOLETUS_PORT:-7878}
      TOLETUS_READ_TIMEOUT: ${TOLETUS_READ_TIMEOUT:-60}
      TOLETUS_RECONNECT_DELAY: ${TOLETUS_RECONNECT_DELAY:-3}
      TOLETUS_PROBE_ON_CONNECT: ${TOLETUS_PROBE_ON_CONNECT:-true}
      TOLETUS_PROBE_ON_TIMEOUT: ${TOLETUS_PROBE_ON_TIMEOUT:-true}
      TOLETUS_DEFAULT_DIRECTION: ${TOLETUS_DEFAULT_DIRECTION:-entry}
      TOLETUS_BIOMETRY_DEFAULT_DIRECTION: ${TOLETUS_BIOMETRY_DEFAULT_DIRECTION:-both}
      TOLETUS_DENY_DURATION_MS: ${TOLETUS_DENY_DURATION_MS:-2000}
      TOLETUS_DENY_BEEP: ${TOLETUS_DENY_BEEP:-2}
      TOLETUS_DENY_LED: ${TOLETUS_DENY_LED:-1}
      SAAS_REQUEST_TIMEOUT: ${SAAS_REQUEST_TIMEOUT:-10}
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - gateway

volumes:
  mongo_data:
