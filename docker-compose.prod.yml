services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    mem_limit: 150m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt:ro
      - ./deploy/www:/var/www/certbot:ro
    mem_limit: 100m

  gateway-toletus:
    build:
      context: ./gateway-toletus
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SAAS_URL: ${SAAS_URL:-http://backend:8000}
      DEVICE_ID: ${GATEWAY_DEVICE_ID:-dev_local_1}
      DEVICE_TOKEN: ${GATEWAY_DEVICE_TOKEN:-}
      TOLETUS_SIMULATOR: ${TOLETUS_SIMULATOR:-true}
      TOLETUS_HOST: ${TOLETUS_HOST:-127.0.0.1}
      TOLETUS_PORT: ${TOLETUS_PORT:-7878}
      TOLETUS_READ_TIMEOUT: ${TOLETUS_READ_TIMEOUT:-60}
      TOLETUS_RECONNECT_DELAY: ${TOLETUS_RECONNECT_DELAY:-3}
      TOLETUS_PROBE_ON_CONNECT: ${TOLETUS_PROBE_ON_CONNECT:-true}
      TOLETUS_PROBE_ON_TIMEOUT: ${TOLETUS_PROBE_ON_TIMEOUT:-true}
      TOLETUS_DEFAULT_DIRECTION: ${TOLETUS_DEFAULT_DIRECTION:-entry}
      TOLETUS_BIOMETRY_DEFAULT_DIRECTION: ${TOLETUS_BIOMETRY_DEFAULT_DIRECTION:-both}
      TOLETUS_DENY_DURATION_MS: ${TOLETUS_DENY_DURATION_MS:-2000}
      TOLETUS_DENY_BEEP: ${TOLETUS_DENY_BEEP:-2}
      TOLETUS_DENY_LED: ${TOLETUS_DENY_LED:-1}
      SAAS_REQUEST_TIMEOUT: ${SAAS_REQUEST_TIMEOUT:-10}
    depends_on:
      - backend
    profiles:
      - gateway
    mem_limit: 100m

volumes:
  mongo_data:
