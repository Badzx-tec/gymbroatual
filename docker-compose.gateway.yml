services:
  gateway-toletus:
    build:
      context: ./gateway-toletus
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SAAS_URL: ${SAAS_URL}
      DEVICE_ID: ${GATEWAY_DEVICE_ID:-}
      DEVICE_TOKEN: ${GATEWAY_DEVICE_TOKEN:-}
      TOLETUS_SIMULATOR: ${TOLETUS_SIMULATOR:-false}
      TOLETUS_HOST: ${TOLETUS_HOST:-127.0.0.1}
      TOLETUS_PORT: ${TOLETUS_PORT:-7878}
      TOLETUS_READ_TIMEOUT: ${TOLETUS_READ_TIMEOUT:-60}
      TOLETUS_RECONNECT_DELAY: ${TOLETUS_RECONNECT_DELAY:-3}
      TOLETUS_PROBE_ON_CONNECT: ${TOLETUS_PROBE_ON_CONNECT:-true}
      TOLETUS_PROBE_ON_TIMEOUT: ${TOLETUS_PROBE_ON_TIMEOUT:-true}
      TOLETUS_DEFAULT_DIRECTION: ${TOLETUS_DEFAULT_DIRECTION:-entry}
      TOLETUS_BIOMETRY_DEFAULT_DIRECTION: ${TOLETUS_BIOMETRY_DEFAULT_DIRECTION:-both}
      TOLETUS_DENY_DURATION_MS: ${TOLETUS_DENY_DURATION_MS:-2000}
      TOLETUS_DENY_BEEP: ${TOLETUS_DENY_BEEP:-2}
      TOLETUS_DENY_LED: ${TOLETUS_DENY_LED:-1}
      SAAS_REQUEST_TIMEOUT: ${SAAS_REQUEST_TIMEOUT:-10}
    mem_limit: 100m
